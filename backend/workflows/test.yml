name: Backend Tests.yml
on:
  push:
    branches:
      - MyFinalSubmission
  pull_request:
    branches:
      - MyFinalSubmission
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Run tests
        run: mvn clean verify

